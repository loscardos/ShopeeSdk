name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ShopeeSdk.sln
      - run: dotnet build ShopeeSdk.sln --no-restore
      - run: dotnet test ShopeeSdk.sln --no-build
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      - run: dotnet pack ShopeeSdk.sln --no-build --output artifacts
      - name: Generator smoke test
        run: |
          if [ -d reference/schemas ]; then
            dotnet run --project src/ShopeeSdk.Generator/ShopeeSdk.Generator.csproj -- reference/schemas
          else
            echo "reference/schemas not present in repository; skipping local reference smoke test"
          fi
