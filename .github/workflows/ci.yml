name: ci

on:
  push:
    branches: [ development, staging ]
  pull_request:
    branches: [ development, staging, production ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ShopeeSdk.sln
      - run: dotnet build ShopeeSdk.sln --no-restore
      - run: dotnet test ShopeeSdk.sln --no-build
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      - run: bash scripts/pack-local.sh
      - run: bash scripts/inspect-nuget.sh
      - run: bash scripts/test-local-nuget.sh
      - name: Verify generated SDK surface
        run: bash scripts/verify-generated.sh
      - run: dotnet run --project samples/ShopeeSdk.SampleConsole -- certify-matrix
